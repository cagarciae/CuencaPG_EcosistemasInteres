name: Actualizar galería
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/sync_kobo.py
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_SERVER: https://kf.kobotoolbox.org   # o https://eu.kobotoolbox.org
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data fotos
          git diff --staged --quiet || (git commit -m "Actualizar datos" && git push)
