<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería de fotos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body{margin:0;font-family:system-ui,sans-serif}
  #mapa{height:50vh}
  #galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding:8px}
  #galeria img{width:100%;height:180px;object-fit:cover;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div id="mapa"></div>
<div id="galeria"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const mapa = L.map('mapa').setView([-34.6, -58.4], 5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(mapa);

const galeria = document.getElementById('galeria');

fetch('data/datos.json?' + Date.now()).then(r => r.json()).then(datos => {
  const puntos = [];
  datos.forEach(d => {
    const mini = document.createElement('img');
    mini.src = d.foto; mini.loading = 'lazy'; mini.alt = d.descripcion || '';
    galeria.appendChild(mini);

    if (d.lat != null) {
      const cont = document.createElement('div');
      const im = document.createElement('img'); im.src = d.foto; im.style.width = '200px';
      const p = document.createElement('p'); p.textContent = d.descripcion || '';
      cont.append(im, p);
      const m = L.marker([d.lat, d.lon]).addTo(mapa).bindPopup(cont);
      puntos.push([d.lat, d.lon]);
      mini.onclick = () => {
        mapa.setView([d.lat, d.lon], 16); m.openPopup();
        scrollTo({top: 0, behavior: 'smooth'});
      };
    }
  });
  if (puntos.length) mapa.fitBounds(puntos, {padding: [30, 30]});
});
</script>
</body>
</html>
